name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest   # GitHub's Ubuntu runners have Docker, which Testcontainers needs
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # Compiles, runs every unit and integration test (against MySQL in Testcontainers)
      # and builds the jar.
      - name: Build and test
        run: ./mvnw -B verify
