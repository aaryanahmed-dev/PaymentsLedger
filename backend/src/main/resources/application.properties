spring.application.name=PaymentsLedger

# All environment-specific settings come from env vars; the defaults suit a local MySQL.
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/payments_ledger}
spring.datasource.username=${DB_USER:ledger_app}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
# Keep database work inside the service layer's transactions instead of the whole web request.
spring.jpa.open-in-view=false
